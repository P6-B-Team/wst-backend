services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wst
      POSTGRES_USER: wst
      POSTGRES_PASSWORD: wst
    ports: ["5432:5432"]
    volumes: ["wst_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wst -d wst"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    env_file: .env
    ports: ["4000:4000"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  wst_pg:
